[project]
name = "aquasense"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-Login>=0.6,<1.0",
    "Flask-WTF>=1.2,<2.0",
    "Flask-Limiter>=3.8,<5.0",
    "PyMySQL>=1.1,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "email-validator>=2.0,<3.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python scripts/prepare_vercel_static.py"